name: Deploy Bowland Theme to Kinsta

on:
  push:
    branches:
      - main
    paths:
      - 'bowland-pharmacy-theme/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bowland to Kinsta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy theme files to Kinsta
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BOWLAND_KINSTA_SSH_HOST }}
          username: ${{ secrets.BOWLAND_KINSTA_SSH_USER }}
          password: ${{ secrets.BOWLAND_KINSTA_SSH_PASSWORD }}
          port: ${{ secrets.BOWLAND_KINSTA_SSH_PORT }}
          source: "bowland-pharmacy-theme/"
          target: "~/public/wp-content/themes/"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BOWLAND_KINSTA_SSH_HOST }}
          username: ${{ secrets.BOWLAND_KINSTA_SSH_USER }}
          password: ${{ secrets.BOWLAND_KINSTA_SSH_PASSWORD }}
          port: ${{ secrets.BOWLAND_KINSTA_SSH_PORT }}
          script: |
            set -euo pipefail
            echo "Checking deployed theme..."
            ls -la ~/public/wp-content/themes/bowland-pharmacy-theme/style.css
            head -7 ~/public/wp-content/themes/bowland-pharmacy-theme/style.css
            echo ""
            echo "Updating Foundayo prices..."
            cd ~/public
            wp eval-file wp-content/themes/bowland-pharmacy-theme/bin/update-foundayo-prices.php
            echo ""
            echo "Updating Atovaquone/Proguanil price..."
            wp eval-file wp-content/themes/bowland-pharmacy-theme/bin/update-atovaquone-proguanil-price.php
            echo ""
            echo "=== Purging Kinsta caches ==="
            wp kinsta cache purge --all
            echo "Deploy complete!"

      - name: Verify public assistant embed
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local url="$1"
            for attempt in 1 2 3 4 5; do
              if curl -fsS "$url" -o "$RUNNER_TEMP/bowland-page.html" \
                && grep -Fq 'functions/v1/pharmacy_chat_widget' "$RUNNER_TEMP/bowland-page.html"; then
                return 0
              fi
              sleep 2
            done
            echo "Assistant embed missing from $url" >&2
            return 1
          }
          verify_page "https://bowlandpharmacy.co.uk/"
          verify_page "https://bowlandpharmacy.co.uk/travel-clinic/"
          verify_page "https://bowlandpharmacy.co.uk/contact/"
          verify_page "https://bowlandpharmacy.co.uk/privacy-policy/"

          curl -fsS -H 'Cache-Control: no-cache' \
            "https://bowlandpharmacy.co.uk/prices/?verify=prices" \
            -o "$RUNNER_TEMP/bowland-prices.html"
          for expected in \
            'Foundayo Tablets' \
            '0.8mg' '£99' \
            '2.5mg' '£119' \
            '5.5mg' '£129' \
            '9mg' '£159' \
            '14.5mg' '£189' \
            '17.2mg' '£199'; do
            grep -Fq "$expected" "$RUNNER_TEMP/bowland-prices.html"
          done
          test "$(grep -Fo 'Foundayo Tablets' "$RUNNER_TEMP/bowland-prices.html" | wc -l | tr -d ' ')" -eq 6

          python3 - "$RUNNER_TEMP/bowland-prices.html" <<'PY'
          from pathlib import Path
          import re
          import sys

          page = Path(sys.argv[1]).read_text(encoding="utf-8")
          label = re.compile(r'<strong>Malaria — Atovaquone/Proguanil</strong>')
          new_price = re.compile(
              r'<strong>Malaria — Atovaquone/Proguanil</strong>\s*</td>\s*'
              r'<td data-label="Price" class="prices-table-num">£2 per tablet</td>'
          )
          old_price = re.compile(
              r'<strong>Malaria — Atovaquone/Proguanil</strong>\s*</td>\s*'
              r'<td data-label="Price" class="prices-table-num">£1.50 per tablet</td>'
          )
          if len(label.findall(page)) != 1 or len(new_price.findall(page)) != 1:
              raise SystemExit("Expected exactly one live Atovaquone/Proguanil row priced at £2 per tablet")
          if old_price.search(page):
              raise SystemExit("The Atovaquone/Proguanil row still has the previous £1.50 per tablet price")
          PY
